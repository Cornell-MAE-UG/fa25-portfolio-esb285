<figure class="image-figure{% if include.class %} {{ include.class }}{% endif %}">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption }}"{% if include.style %} style="{{ include.style }}"{% endif %}>
  {% if include.caption %}<figcaption class="image-caption">{{ include.caption }}</figcaption>{% endif %}
</figure>
