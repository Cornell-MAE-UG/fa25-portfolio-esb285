{% assign image_alt = include.alt | default: include.caption | default: "Project image" %}

<figure class="image-figure{% if include.class %} {{ include.class | escape }}{% endif %}">
  <img src="{{ include.src | relative_url }}" alt="{{ image_alt | escape }}"{% if include.style %} style="{{ include.style | escape }}"{% endif %}>
  {% if include.caption %}
    <figcaption class="image-caption">{{ include.caption | escape }}</figcaption>
  {% endif %}
</figure>
