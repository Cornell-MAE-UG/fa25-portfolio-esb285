---
layout: default
---

<h1>{{ page.title }}</h1>

<figure class="image-figure">
    <img src="{{ page.image | relative_url }}" alt="{{ page.imagealt | default: page.title }}" class="project-image" />
    <figcaption class="image-caption">{{ page.imagecaption | default: page.title }}</figcaption>
</figure>

<div class="project-content">
    {{ content }}
</div>

<p><strong>Technologies Used</strong>: {{ page.technologies | join: ", " }}</p>

<a href={{ "/projects/" | relative_url }} class="back-arrow">
    <i class="bi bi-arrow-left-circle-fill"></i> Back to Projects
</a>
