---
layout: default
---

<h1>{{ page.title }}</h1>

<figure class="image-figure">
    <img src="{{ page.image | relative_url }}" alt="{{ page.imagealt | default: page.title }}" class="project-image" />
    <figcaption class="image-caption">{{ page.imagecaption | default: page.title }}</figcaption>
</figure>

<div class="project-content">
    {{ content }}
</div>

<p><strong>Technologies Used</strong>: {{ page.technologies | join: ", " }}</p>

<a href="{{ "/projects/" | relative_url }}" class="back-arrow">
    <i class="bi bi-arrow-left-circle-fill"></i> Back to Projects
</a>

<!-- Back to Top Button (Recommendation 8) -->
<button class="back-to-top" id="backToTop" aria-label="Back to top">
    <i class="bi bi-arrow-up"></i>
</button>

<script>
// Back to Top Button functionality
const backToTopBtn = document.getElementById('backToTop');

// Show button when scrolled down
window.addEventListener('scroll', function() {
    if (window.scrollY > 300) {
        backToTopBtn.classList.add('show');
    } else {
        backToTopBtn.classList.remove('show');
    }
});

// Scroll to top when button clicked
backToTopBtn.addEventListener('click', function() {
    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
});
</script>
